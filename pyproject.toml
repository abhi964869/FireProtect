[project]
name = "fireprotect"
version = "1.0.0"
description = "IoT smart fire detection system - ESP32, MQTT, ML and a live dashboard"
requires-python = ">=3.10"

[tool.ruff]
line-length = 90
target-version = "py310"
extend-exclude = ["firmware/.pio", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    # The project targets Python 3.10, where `datetime.UTC` does not exist.
    "UP017",
]

[tool.ruff.lint.isort]
# Without this, ruff sorts the backend's own package in with third-party deps.
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# ml/train.py and the ml tests must extend sys.path before importing siblings,
# so module-level imports legitimately appear after code.
"ml/train.py" = ["E402"]
# Tests reach into private helpers deliberately to exercise callback paths.
"backend/tests/*" = ["SLF001", "B011"]
"ml/tests/*" = ["SLF001", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "(firmware/\\.pio|frontend/|\\.venv)"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests", "simulator/tests"]
pythonpath = ["backend", "ml", "simulator"]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]
