# nginx config for the FireProtect dashboard.
#
# Serves the built SPA and reverse-proxies /api and /ws to the backend, so the
# browser only ever talks to one origin. That keeps CORS out of the picture and
# lets the frontend derive its WebSocket URL from window.location.

upstream fireprotect_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://fireprotect_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://fireprotect_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A live telemetry socket is idle between readings; the default 60s
        # read timeout would drop it and cause needless reconnect churn.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: the dashboard is a single page, so unknown paths render it
    # rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
