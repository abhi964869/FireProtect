; FireProtect ESP32 firmware
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; Wi-Fi and MQTT settings come from build flags so no credentials are ever
; committed. Copy `secrets.ini.example` to `secrets.ini` and edit it.

[platformio]
default_envs = esp32dev

[common]
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -D FIREPROTECT_VERSION=\"1.0.0\"
    ; Publish interval in milliseconds. 2000 matches the training data's
    ; sampling period, so on-device features match what the model saw.
    -D PUBLISH_INTERVAL_MS=2000
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.4

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
build_src_filter = +<*> -<.git/>
extra_scripts = pre:load_secrets.py

; Wokwi simulation target - same source, no secrets required. Wokwi's gateway
; provides the `Wokwi-GUEST` open network.
[env:wokwi]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -D WOKWI_SIMULATION=1
    -D WIFI_SSID=\"Wokwi-GUEST\"
    -D WIFI_PASSWORD=\"\"
    -D MQTT_HOST=\"broker.hivemq.com\"
    -D MQTT_PORT=1883
lib_deps = ${common.lib_deps}

; Native host build used purely to compile-check the model header and the
; pure-logic units without an ESP32 toolchain.
[env:native_test]
platform = native
build_flags = -std=c++17 -Wall -Wextra -I include
build_src_filter = -<*>
test_framework = unity
