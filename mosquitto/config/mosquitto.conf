# Mosquitto configuration for FireProtect.
#
# SECURITY NOTE
# -------------
# Anonymous access is enabled because ESP32 nodes on a trusted LAN are the
# intended clients and the broker is not exposed to the internet by this
# compose file. Do NOT port-forward 1883 to the public internet with this
# config. To require credentials instead:
#
#   1. allow_anonymous false
#   2. docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd <user>
#   3. uncomment the password_file line below
#   4. set MQTT_USERNAME / MQTT_PASSWORD for the backend and in
#      firmware/secrets.ini for each device
#
# See docs/SETUP.md for the full walkthrough.

listener 1883
allow_anonymous true
# password_file /mosquitto/config/passwd

# WebSocket listener, so a browser client could subscribe directly if needed.
# The dashboard does not use this - it talks to the backend's own WebSocket.
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true

# An ESP32 publishing every 2 s with QoS 1 needs a modest inflight window.
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 8192
